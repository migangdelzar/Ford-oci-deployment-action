name: OCI blue-green deploy
description: Deploy or roll back Ford Service, Ford MCP, or the private scraper scheduler on existing OCI VMs.
inputs:
  target:
    description: Deployment target (ford-service, ford-mcp, or ford-scraper-scheduler).
    required: true
  image:
    description: Immutable GHCR digest for deploy. Rollback resolves the recorded prior image.
    required: false
  operation:
    description: deploy or rollback.
    required: false
    default: deploy
  source-sha:
    description: Verified source commit for deploy, or recorded-rollback for operator rollback.
    required: true
  host:
    description: SSH host for the existing VM.
    required: true
  user:
    description: SSH user for the existing VM.
    required: true
  ssh-private-key:
    description: SSH private key for the target VM (emme-1 for Ford Service, emme-2 for MCP).
    required: true
  backup-ssh-private-key:
    description: Separate SSH private key for the data VM backup before Ford Service or scheduler deploys.
    required: false
  ssh-known-hosts:
    description: Pinned known_hosts entries for the deployment host and, when needed, the data VM.
    required: true
  registry-username:
    description: GHCR username associated with the short-lived package token.
    required: true
  registry-token:
    description: Short-lived GHCR token with packages:read.
    required: true
  remote-root:
    description: Provisioned deployment directory on the VM.
    required: false
    default: /opt/ford
  backup-host:
    description: Existing data VM host to back up before Ford Service or scraper scheduler; also the MCP target host.
    required: false
  backup-user:
    description: SSH user for the data VM; defaults to the deployment user.
    required: false
  mcp-private-ip:
    description: Existing MCP VM private IP used in the stable listener configuration.
    required: false
  secrets-provider:
    description: Runtime secret provider used by the deployment (oci-vault).
    required: false
  postgres-password-secret-ocid:
    description: OCI Vault secret OCID for the MCP database password.
    required: false
  mcp-http-bearer-token-secret-ocid:
    description: OCI Vault secret OCID for the MCP HTTP bearer token.
    required: false
  mcp-public-smoke-access-client-id:
    description: Cloudflare Access service-token client ID used by the public MCP smoke check.
    required: false
  mcp-public-smoke-access-client-secret-secret-ocid:
    description: OCI Vault secret OCID for the Cloudflare Access client secret used by the MCP smoke check.
    required: false
  data-private-ip:
    description: Existing data VM private IP used by the Ford Service for PostgreSQL and Redis.
    required: false
  operator-username:
    description: Email address for the Ford Service password-login operator.
    required: false
  meta-delivery-enabled:
    description: Enable Meta outbound delivery for Ford Service.
    required: false
    default: "false"
  outbox-enabled:
    description: Enable durable outbound event processing for Ford Service.
    required: false
    default: "false"
  meta-whatsapp-delivery-endpoint:
    description: Official Graph API messages endpoint for the configured WhatsApp phone number.
    required: false
  meta-phone-number-id:
    description: WhatsApp phone number ID used by the app binding.
    required: false
  meta-app-secret-ocid:
    description: OCI Vault secret OCID for the Meta app secret.
    required: false
  meta-verify-token-ocid:
    description: OCI Vault secret OCID for the Meta webhook verification token.
    required: false
  meta-whatsapp-access-token-secret-ocid:
    description: OCI Vault secret OCID for the WhatsApp delivery access token.
    required: false
  ui-upstream-url:
    description: Cloudflare Pages origin proxied by Ford Service for browser UI routes and assets.
    required: false
    default: https://emme-crm-ui.pages.dev
  grafana-cloud-otlp-endpoint:
    description: Grafana Cloud OTLP endpoint for the Ford Service Collector.
    required: false
  grafana-cloud-instance-id:
    description: Grafana Cloud OTLP instance ID.
    required: false
  grafana-cloud-api-token-secret-ocid:
    description: OCI Vault secret OCID for the Grafana Cloud API token.
    required: false
  langfuse-otlp-endpoint:
    description: Langfuse Cloud OTLP endpoint for redacted traces.
    required: false
  langfuse-public-key:
    description: Langfuse public project key.
    required: false
  langfuse-secret-key-secret-ocid:
    description: OCI Vault secret OCID for the Langfuse secret key.
    required: false
  service-catalog-tools-enabled:
    description: Enable Ford Service local read-only catalog tools; keep disabled until reviewed.
    required: false
    default: "false"
  service-catalog-jdbc-url:
    description: Dedicated read-only catalog JDBC URL for Ford Service.
    required: false
  service-catalog-username:
    description: Least-privilege Ford catalog reader username.
    required: false
  service-catalog-password-secret-ocid:
    description: OCI Vault secret OCID for the catalog reader password.
    required: false
runs:
  using: composite
  steps:
    - name: Deploy through the shared Ansible playbook
      shell: bash
      env:
        OCI_TARGET: ${{ inputs.target }}
        OCI_IMAGE: ${{ inputs.image }}
        OCI_OPERATION: ${{ inputs.operation }}
        OCI_SOURCE_SHA: ${{ inputs['source-sha'] }}
        OCI_DEPLOY_HOST: ${{ inputs.host }}
        OCI_DEPLOY_USER: ${{ inputs.user }}
        OCI_SSH_PRIVATE_KEY: ${{ inputs['ssh-private-key'] }}
        OCI_BACKUP_SSH_PRIVATE_KEY: ${{ inputs['backup-ssh-private-key'] }}
        OCI_SSH_KNOWN_HOSTS: ${{ inputs['ssh-known-hosts'] }}
        OCI_REGISTRY_USERNAME: ${{ inputs['registry-username'] }}
        GHCR_TOKEN: ${{ inputs['registry-token'] }}
        OCI_REMOTE_ROOT: ${{ inputs['remote-root'] }}
        OCI_BACKUP_HOST: ${{ inputs['backup-host'] }}
        OCI_BACKUP_USER: ${{ inputs['backup-user'] }}
        OCI_MCP_PRIVATE_IP: ${{ inputs['mcp-private-ip'] }}
        OCI_SECRETS_PROVIDER: ${{ inputs['secrets-provider'] }}
        FORD_SECRETS_PROVIDER: ${{ inputs['secrets-provider'] }}
        OCI_MCP_POSTGRES_PASSWORD_SECRET_OCID: ${{ inputs['postgres-password-secret-ocid'] }}
        OCI_MCP_HTTP_BEARER_TOKEN_SECRET_OCID: ${{ inputs['mcp-http-bearer-token-secret-ocid'] }}
        OCI_MCP_PUBLIC_SMOKE_ACCESS_CLIENT_ID: ${{ inputs['mcp-public-smoke-access-client-id'] }}
        OCI_MCP_PUBLIC_SMOKE_ACCESS_CLIENT_SECRET_SECRET_OCID: ${{ inputs['mcp-public-smoke-access-client-secret-secret-ocid'] }}
        OCI_DATA_PRIVATE_IP: ${{ inputs['data-private-ip'] }}
        OCI_OPERATOR_USERNAME: ${{ inputs['operator-username'] }}
        OCI_META_DELIVERY_ENABLED: ${{ inputs['meta-delivery-enabled'] }}
        OCI_OUTBOX_ENABLED: ${{ inputs['outbox-enabled'] }}
        OCI_META_WHATSAPP_DELIVERY_ENDPOINT: ${{ inputs['meta-whatsapp-delivery-endpoint'] }}
        OCI_META_PHONE_NUMBER_ID: ${{ inputs['meta-phone-number-id'] }}
        OCI_META_APP_SECRET_OCID: ${{ inputs['meta-app-secret-ocid'] }}
        OCI_META_VERIFY_TOKEN_OCID: ${{ inputs['meta-verify-token-ocid'] }}
        OCI_META_WHATSAPP_ACCESS_TOKEN_SECRET_OCID: ${{ inputs['meta-whatsapp-access-token-secret-ocid'] }}
        FORD_WEB_UI_UPSTREAM_URL: ${{ inputs['ui-upstream-url'] }}
        OCI_GRAFANA_CLOUD_OTLP_ENDPOINT: ${{ inputs['grafana-cloud-otlp-endpoint'] }}
        OCI_GRAFANA_CLOUD_INSTANCE_ID: ${{ inputs['grafana-cloud-instance-id'] }}
        OCI_GRAFANA_CLOUD_API_TOKEN_SECRET_OCID: ${{ inputs['grafana-cloud-api-token-secret-ocid'] }}
        OCI_LANGFUSE_OTLP_ENDPOINT: ${{ inputs['langfuse-otlp-endpoint'] }}
        OCI_LANGFUSE_PUBLIC_KEY: ${{ inputs['langfuse-public-key'] }}
        OCI_LANGFUSE_SECRET_KEY_SECRET_OCID: ${{ inputs['langfuse-secret-key-secret-ocid'] }}
        OCI_SERVICE_CATALOG_TOOLS_ENABLED: ${{ inputs['service-catalog-tools-enabled'] }}
        OCI_SERVICE_CATALOG_JDBC_URL: ${{ inputs['service-catalog-jdbc-url'] }}
        OCI_SERVICE_CATALOG_USERNAME: ${{ inputs['service-catalog-username'] }}
        FORD_VAULT_SECRET_OCID_FORD_CATALOG_PASSWORD: ${{ inputs['service-catalog-password-secret-ocid'] }}
        OCI_SERVICE_SOURCE_ROOT: ${{ github.workspace }}
      run: ${{ github.action_path }}/deploy.sh
