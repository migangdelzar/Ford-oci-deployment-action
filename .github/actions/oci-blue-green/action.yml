name: OCI blue-green deploy
description: Deploy or roll back Ford Service or MCP on its existing OCI VM.
inputs:
  target:
    description: Deployment target (ford-service or ford-mcp).
    required: true
  image:
    description: Immutable GHCR digest for deploy. Rollback resolves the recorded prior image.
    required: false
  operation:
    description: deploy or rollback.
    required: false
    default: deploy
  source-sha:
    description: Verified source commit for deploy, or recorded-rollback for operator rollback.
    required: true
  host:
    description: SSH host for the existing VM.
    required: true
  user:
    description: SSH user for the existing VM.
    required: true
  ssh-private-key:
    description: SSH private key for the target VM (emme-1 for Ford Service, emme-2 for MCP).
    required: true
  backup-ssh-private-key:
    description: Optional separate SSH private key for the existing data VM backup; MCP uses its deploy key when omitted.
    required: false
  ssh-known-hosts:
    description: Pinned known_hosts entries for the deployment host and, when needed, the data VM.
    required: true
  registry-username:
    description: GHCR username associated with the short-lived package token.
    required: true
  registry-token:
    description: Short-lived GHCR token with packages:read.
    required: true
  remote-root:
    description: Provisioned deployment directory on the VM.
    required: false
    default: /opt/ford
  backup-host:
    description: Existing data VM host to back up before Ford Service or MCP deploys.
    required: false
  backup-user:
    description: SSH user for the data VM; defaults to the deployment user.
    required: false
  mcp-private-ip:
    description: Existing MCP VM private IP used in the stable listener configuration.
    required: false
  secrets-provider:
    description: Runtime secret provider used by the deployment (oci-vault).
    required: false
  postgres-password-secret-ocid:
    description: OCI Vault secret OCID for the MCP database password.
    required: false
  mcp-http-bearer-token-secret-ocid:
    description: OCI Vault secret OCID for the MCP HTTP bearer token.
    required: false
  data-private-ip:
    description: Existing data VM private IP used by the Ford Service for PostgreSQL and Redis.
    required: false
  operator-username:
    description: Email address for the Ford Service password-login operator.
    required: false
  service-mcp-enabled:
    description: Enable the production Ford MCP connection for Ford Service.
    required: false
    default: "true"
  service-mcp-url:
    description: HTTPS origin for the production Ford MCP service.
    required: false
  service-mcp-access-client-id:
    description: Cloudflare Access service-token client ID for Ford MCP.
    required: false
  service-mcp-token-secret-ocid:
    description: OCI Vault secret OCID for the Ford MCP bearer token.
    required: false
  service-mcp-access-client-secret-secret-ocid:
    description: OCI Vault secret OCID for the Cloudflare Access client secret.
    required: false
  ui-upstream-url:
    description: Cloudflare Pages origin proxied by Ford Service for browser UI routes and assets.
    required: false
    default: https://emme-crm-ui.pages.dev
  grafana-cloud-otlp-endpoint:
    description: Grafana Cloud OTLP endpoint for the Ford Service Collector.
    required: false
  grafana-cloud-instance-id:
    description: Grafana Cloud OTLP instance ID.
    required: false
  grafana-cloud-api-token-secret-ocid:
    description: OCI Vault secret OCID for the Grafana Cloud API token.
    required: false
  langfuse-otlp-endpoint:
    description: Langfuse Cloud OTLP endpoint for redacted traces.
    required: false
  langfuse-public-key:
    description: Langfuse public project key.
    required: false
  langfuse-secret-key-secret-ocid:
    description: OCI Vault secret OCID for the Langfuse secret key.
    required: false
runs:
  using: composite
  steps:
    - name: Deploy through the shared Ansible playbook
      shell: bash
      env:
        OCI_TARGET: ${{ inputs.target }}
        OCI_IMAGE: ${{ inputs.image }}
        OCI_OPERATION: ${{ inputs.operation }}
        OCI_SOURCE_SHA: ${{ inputs['source-sha'] }}
        OCI_DEPLOY_HOST: ${{ inputs.host }}
        OCI_DEPLOY_USER: ${{ inputs.user }}
        OCI_SSH_PRIVATE_KEY: ${{ inputs['ssh-private-key'] }}
        OCI_BACKUP_SSH_PRIVATE_KEY: ${{ inputs['backup-ssh-private-key'] }}
        OCI_SSH_KNOWN_HOSTS: ${{ inputs['ssh-known-hosts'] }}
        OCI_REGISTRY_USERNAME: ${{ inputs['registry-username'] }}
        GHCR_TOKEN: ${{ inputs['registry-token'] }}
        OCI_REMOTE_ROOT: ${{ inputs['remote-root'] }}
        OCI_BACKUP_HOST: ${{ inputs['backup-host'] }}
        OCI_BACKUP_USER: ${{ inputs['backup-user'] }}
        OCI_MCP_PRIVATE_IP: ${{ inputs['mcp-private-ip'] }}
        OCI_SECRETS_PROVIDER: ${{ inputs['secrets-provider'] }}
        FORD_SECRETS_PROVIDER: ${{ inputs['secrets-provider'] }}
        OCI_MCP_POSTGRES_PASSWORD_SECRET_OCID: ${{ inputs['postgres-password-secret-ocid'] }}
        OCI_MCP_HTTP_BEARER_TOKEN_SECRET_OCID: ${{ inputs['mcp-http-bearer-token-secret-ocid'] }}
        OCI_DATA_PRIVATE_IP: ${{ inputs['data-private-ip'] }}
        OCI_OPERATOR_USERNAME: ${{ inputs['operator-username'] }}
        OCI_SERVICE_MCP_ENABLED: ${{ inputs['service-mcp-enabled'] }}
        OCI_SERVICE_MCP_URL: ${{ inputs['service-mcp-url'] }}
        OCI_SERVICE_MCP_ACCESS_CLIENT_ID: ${{ inputs['service-mcp-access-client-id'] }}
        OCI_SERVICE_MCP_TOKEN_SECRET_OCID: ${{ inputs['service-mcp-token-secret-ocid'] }}
        OCI_SERVICE_MCP_ACCESS_CLIENT_SECRET_SECRET_OCID: ${{ inputs['service-mcp-access-client-secret-secret-ocid'] }}
        FORD_WEB_UI_UPSTREAM_URL: ${{ inputs['ui-upstream-url'] }}
        OCI_GRAFANA_CLOUD_OTLP_ENDPOINT: ${{ inputs['grafana-cloud-otlp-endpoint'] }}
        OCI_GRAFANA_CLOUD_INSTANCE_ID: ${{ inputs['grafana-cloud-instance-id'] }}
        OCI_GRAFANA_CLOUD_API_TOKEN_SECRET_OCID: ${{ inputs['grafana-cloud-api-token-secret-ocid'] }}
        OCI_LANGFUSE_OTLP_ENDPOINT: ${{ inputs['langfuse-otlp-endpoint'] }}
        OCI_LANGFUSE_PUBLIC_KEY: ${{ inputs['langfuse-public-key'] }}
        OCI_LANGFUSE_SECRET_KEY_SECRET_OCID: ${{ inputs['langfuse-secret-key-secret-ocid'] }}
        OCI_SERVICE_SOURCE_ROOT: ${{ github.workspace }}
      run: ${{ github.action_path }}/deploy.sh
