name: Test OCI deployment action

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Ansible tooling
        run: |
          python -m pip install --disable-pip-version-check 'ansible-core==2.21.4'
          ansible-galaxy collection install --requirements-file deployment/ansible/requirements.yml
      - name: Validate shell syntax
        run: bash -n .github/actions/oci-blue-green/deploy.sh
      - name: Run action package contract tests
        run: python -m unittest discover -s tests -v
      - name: Validate both deployment playbooks
        run: |
          inventory="$RUNNER_TEMP/ansible-inventory.ini"
          cat > "$inventory" <<'INVENTORY'
          [app]
          localhost ansible_connection=local

          [data]
          localhost ansible_connection=local
          INVENTORY
          export ANSIBLE_ROLES_PATH="$GITHUB_WORKSPACE/deployment/ansible/roles"
          ansible-playbook -i "$inventory" deployment/ansible/app-blue-green.yml --syntax-check
          ansible-playbook -i "$inventory" deployment/ansible/mcp-blue-green.yml --syntax-check
          app_tasks="$RUNNER_TEMP/app-ansible-tasks.txt"
          mcp_tasks="$RUNNER_TEMP/mcp-ansible-tasks.txt"
          ansible-playbook -i "$inventory" deployment/ansible/app-blue-green.yml --list-tasks | tee "$app_tasks"
          ansible-playbook -i "$inventory" deployment/ansible/mcp-blue-green.yml --list-tasks | tee "$mcp_tasks"
          grep -Fq 'app : Validate blue-green Ford Service inputs' "$app_tasks"
          grep -Fq 'mcp : Validate blue-green MCP deployment inputs' "$mcp_tasks"
          grep -Fq 'app : Read observability credentials from OCI Vault' "$app_tasks"
          grep -Fq 'mcp : Read MCP runtime credentials from OCI Vault' "$mcp_tasks"
