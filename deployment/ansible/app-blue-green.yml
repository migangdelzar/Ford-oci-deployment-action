---
- name: Deploy Ford Service with a local blue-green proxy
  hosts: app
  become: false
  roles:
    - role: app
      tasks_from: blue-green.yml
  post_tasks:
    - name: Fetch redacted Ford Service release metadata for the deployment summary
      ansible.builtin.fetch:
        src: "{{ remote_root }}/app/active-release.json"
        dest: "{{ release_summary_path }}"
        flat: true
      when: release_summary_path is defined
