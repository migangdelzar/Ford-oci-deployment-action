---
- name: Validate scheduler release request
  ansible.builtin.assert:
    that:
      - scheduler_operation | default('deploy') in ['deploy', 'rollback']
      - scheduler_operation | default('deploy') == 'rollback' or scheduler_image is match('^ghcr[.]io/[A-Za-z0-9._/-]+@sha256:[a-f0-9]{64}$')
      - scheduler_secrets_provider == 'oci-vault'
      - scheduler_postgres_password_secret_ocid is match('^ocid1[.]vaultsecret[.][A-Za-z0-9.]+$')
    fail_msg: "Scraper scheduler release requires an immutable image and the existing PostgreSQL Vault reference."

- name: Read prior scheduler release state
  ansible.builtin.stat:
    path: "{{ remote_root }}/mcp/scheduler-release.json"
  register: scheduler_state_file

- name: Load prior scheduler release state
  ansible.builtin.slurp:
    src: "{{ remote_root }}/mcp/scheduler-release.json"
  register: scheduler_state_raw
  when: scheduler_state_file.stat.exists

- name: Inspect the scheduler container for its current image
  ansible.builtin.command:
    cmd: docker inspect --format {% raw %}'{{range .RepoDigests}}{{println .}}{{end}}'{% endraw %} ford-scraping-scheduler
  register: scheduler_container_image
  changed_when: false
  failed_when: false

- name: Resolve current and candidate scheduler images
  ansible.builtin.set_fact:
    scheduler_state: "{{ (scheduler_state_raw.content | b64decode | from_json) if scheduler_state_file.stat.exists else {} }}"
    scheduler_current_image: "{{ (scheduler_state_raw.content | b64decode | from_json).active_image if scheduler_state_file.stat.exists else (scheduler_container_image.stdout_lines[0] | default('')) }}"

- name: Validate scheduler rollback state
  ansible.builtin.assert:
    that:
      - scheduler_operation | default('deploy') != 'rollback' or (scheduler_state_file.stat.exists and scheduler_state.previous_image is match('^ghcr[.]io/[A-Za-z0-9._/-]+@sha256:[a-f0-9]{64}$'))
      - scheduler_current_image | length == 0 or scheduler_current_image is match('^ghcr[.]io/[A-Za-z0-9._/-]+@sha256:[a-f0-9]{64}$')
    fail_msg: "Scheduler rollback requires a recorded prior immutable image."

- name: Select scheduler release image
  ansible.builtin.set_fact:
    scheduler_candidate_image: "{{ scheduler_state.previous_image if scheduler_operation | default('deploy') == 'rollback' else scheduler_image }}"

- name: Render private scheduler Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ remote_root }}/mcp/scheduler-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"
  no_log: true

- name: Pull the immutable scheduler image with temporary GHCR credentials
  block:
    - name: Create temporary registry credential directory
      ansible.builtin.tempfile:
        state: directory
        path: /tmp
        prefix: ford-scheduler-ghcr-
      register: scheduler_registry_config

    - name: Authenticate temporarily to GHCR
      ansible.builtin.command:
        cmd: docker login ghcr.io --username "{{ ghcr_username }}" --password-stdin
        stdin: "{{ lookup('ansible.builtin.env', 'GHCR_TOKEN') }}"
      environment:
        DOCKER_CONFIG: "{{ scheduler_registry_config.path }}"
      changed_when: false
      no_log: true

    - name: Pull the immutable scheduler image
      ansible.builtin.command:
        cmd: docker pull "{{ scheduler_candidate_image }}"
      environment:
        DOCKER_CONFIG: "{{ scheduler_registry_config.path }}"
      changed_when: true

  always:
    - name: Remove temporary scheduler registry credentials
      ansible.builtin.file:
        path: "{{ scheduler_registry_config.path }}"
        state: absent
      when: scheduler_registry_config.path is defined

- name: Install OCI CLI for data-host Instance Principal secret reads
  ansible.builtin.import_role:
    name: backup
    tasks_from: install-oci-cli.yml
  become: true
  when: scheduler_operation | default('deploy') in ['deploy', 'rollback']

- name: Read the existing PostgreSQL password from OCI Vault without exposing it
  ansible.builtin.command:
    argv:
      - /usr/local/bin/oci
      - secrets
      - secret-bundle
      - get
      - --auth
      - instance_principal
      - --secret-id
      - "{{ scheduler_postgres_password_secret_ocid }}"
      - --query
      - 'data."secret-bundle-content".content'
      - --raw-output
  register: scheduler_database_password_secret
  changed_when: false
  no_log: true
  when: scheduler_operation | default('deploy') in ['deploy', 'rollback']

- name: Decode the existing database password for protected scheduler operations
  ansible.builtin.set_fact:
    scheduler_database_password: "{{ scheduler_database_password_secret.stdout | trim | b64decode }}"
  no_log: true
  when: scheduler_operation | default('deploy') in ['deploy', 'rollback']

- name: Require a non-empty existing database password
  ansible.builtin.assert:
    that:
      - scheduler_database_password is defined
      - scheduler_database_password | length > 0
    fail_msg: "The existing PostgreSQL Vault secret was empty; scheduler release stopped."
  no_log: true
  when: scheduler_operation | default('deploy') in ['deploy', 'rollback']

- name: Migrate the catalog using the candidate image after the verified backup
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - ford-scraper-scheduler
      - -f
      - "{{ remote_root }}/mcp/scheduler-compose.yml"
      - run
      - --rm
      - scheduler
      - node
      - dist/src/cli.js
      - migrate
  when: scheduler_operation | default('deploy') == 'deploy'
  changed_when: true
  no_log: true

- name: Provision or repair the catalog reader role
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - --interactive
      - --env
      - CATALOG_READER_PASSWORD
      - --user
      - postgres
      - data-postgres-1
      - psql
      - -X
      - -q
      - -v
      - ON_ERROR_STOP=1
      - --username
      - postgres
      - --dbname
      - ford_service
    stdin: |
      \getenv catalog_reader_password CATALOG_READER_PASSWORD
      BEGIN;
      SELECT format(
        'CREATE ROLE ford_catalog_reader LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION PASSWORD %L',
        :'catalog_reader_password'
      )
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'ford_catalog_reader')
      \gexec
      ALTER ROLE ford_catalog_reader
        LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION
        PASSWORD :'catalog_reader_password';
      DO $catalog_reader_memberships$
      DECLARE granted_role text;
      BEGIN
        FOR granted_role IN
          SELECT granted.rolname
          FROM pg_auth_members AS memberships
          JOIN pg_roles AS granted ON granted.oid = memberships.roleid
          JOIN pg_roles AS member ON member.oid = memberships.member
          WHERE member.rolname = 'ford_catalog_reader'
        LOOP
          EXECUTE format('REVOKE %I FROM ford_catalog_reader', granted_role);
        END LOOP;
      END
      $catalog_reader_memberships$;
      REVOKE ALL PRIVILEGES ON SCHEMA ford FROM ford_catalog_reader;
      REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA ford FROM ford_catalog_reader;
      REVOKE ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA ford FROM ford_catalog_reader;
      REVOKE ALL PRIVILEGES ON SCHEMA ford_read FROM ford_catalog_reader;
      REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA ford_read FROM ford_catalog_reader;
      REVOKE ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA ford_read FROM ford_catalog_reader;
      ALTER DEFAULT PRIVILEGES FOR ROLE ford IN SCHEMA ford_read
        REVOKE ALL ON TABLES FROM ford_catalog_reader;
      GRANT CONNECT ON DATABASE ford_service TO ford_catalog_reader;
      GRANT USAGE ON SCHEMA ford_read TO ford_catalog_reader;
      GRANT SELECT ON ALL TABLES IN SCHEMA ford_read TO ford_catalog_reader;
      ALTER DEFAULT PRIVILEGES FOR ROLE ford IN SCHEMA ford_read
        GRANT SELECT ON TABLES TO ford_catalog_reader;
      ALTER ROLE ford_catalog_reader SET default_transaction_read_only = on;
      COMMIT;
  environment:
    CATALOG_READER_PASSWORD: "{{ scheduler_database_password }}"
  register: catalog_reader_setup
  changed_when: true
  no_log: true
  when: scheduler_operation | default('deploy') in ['deploy', 'rollback']

- name: Verify the catalog reader is select-only on the versioned views
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - --interactive
      - --user
      - postgres
      - data-postgres-1
      - psql
      - -X
      - -q
      - -v
      - ON_ERROR_STOP=1
      - -A
      - -t
      - -F
      - '|'
      - --username
      - postgres
      - --dbname
      - ford_service
    stdin: |
      SELECT
        has_database_privilege('ford_catalog_reader', 'ford_service', 'CONNECT'),
        has_schema_privilege('ford_catalog_reader', 'ford_read', 'USAGE'),
        has_table_privilege('ford_catalog_reader', 'ford_read.vehicle_search_v1', 'SELECT'),
        has_table_privilege('ford_catalog_reader', 'ford_read.vehicle_search_v1', 'INSERT'),
        has_schema_privilege('ford_catalog_reader', 'ford', 'USAGE'),
        NOT EXISTS (
          SELECT 1 FROM pg_auth_members
          WHERE member = (SELECT oid FROM pg_roles WHERE rolname = 'ford_catalog_reader')
        );
      SET ROLE ford_catalog_reader;
      SELECT count(*) FROM ford_read.vehicle_search_v1;
      RESET ROLE;
  register: catalog_reader_verification
  changed_when: false
  no_log: true
  when: scheduler_operation | default('deploy') in ['deploy', 'rollback']

- name: Require the catalog reader permission contract to pass
  ansible.builtin.assert:
    that:
      - catalog_reader_verification.stdout_lines[0] == 't|t|t|f|f|t'
      - catalog_reader_verification.stdout_lines[1] is match('^[0-9]+$')
    fail_msg: "Catalog reader must query versioned views while writes and base-schema access remain denied."
  when: scheduler_operation | default('deploy') in ['deploy', 'rollback']

- name: Verify catalog reader login and read-only query
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - --interactive
      - --env
      - PGPASSWORD
      - --user
      - postgres
      - data-postgres-1
      - psql
      - -X
      - -q
      - -v
      - ON_ERROR_STOP=1
      - -A
      - -t
      - -h
      - 127.0.0.1
      - --username
      - ford_catalog_reader
      - --dbname
      - ford_service
    stdin: SELECT count(*) FROM ford_read.vehicle_search_v1;
  environment:
    PGPASSWORD: "{{ scheduler_database_password }}"
  register: catalog_reader_login
  changed_when: false
  no_log: true
  when: scheduler_operation | default('deploy') in ['deploy', 'rollback']

- name: Require the catalog reader login to query the view
  ansible.builtin.assert:
    that:
      - catalog_reader_login.stdout | trim is match('^[0-9]+$')
    fail_msg: "The catalog reader login could not query ford_read.vehicle_search_v1."
  no_log: true
  when: scheduler_operation | default('deploy') in ['deploy', 'rollback']

- name: Replace the single active scheduler with the candidate image
  block:
    - name: Stop and remove the exact legacy scheduler container
      ansible.builtin.command:
        cmd: docker rm --force ford-scraping-scheduler
      when: scheduler_current_image | length > 0
      changed_when: true

    - name: Start and health-check the scheduler candidate
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - ford-scraper-scheduler
          - -f
          - "{{ remote_root }}/mcp/scheduler-compose.yml"
          - up
          - -d
          - --wait
          - scheduler
      changed_when: true
      no_log: true

    - name: Read scheduler startup log
      ansible.builtin.command:
        cmd: docker logs ford-scraping-scheduler
      register: scheduler_startup_log
      changed_when: false
      no_log: true

    - name: Verify the configured monthly scheduler is active
      ansible.builtin.assert:
        that:
          - "'Scheduler active: 0 12 1 * * (America/Mexico_City)' in scheduler_startup_log.stdout"
        fail_msg: "Scheduler container passed health but did not confirm its configured monthly schedule."

    - name: Record active and previous scheduler images
      ansible.builtin.copy:
        dest: "{{ remote_root }}/mcp/scheduler-release.json"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
        content: >-
          {{ {
            'active_image': scheduler_candidate_image,
            'active_slot': 'scheduler',
            'previous_image': (scheduler_current_image if scheduler_current_image | length > 0 else none)
          } | to_nice_json }}

  rescue:
    - name: Render previous scheduler image for rollback
      ansible.builtin.template:
        src: compose.yml.j2
        dest: "{{ remote_root }}/mcp/scheduler-compose.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0640"
      vars:
        scheduler_candidate_image: "{{ scheduler_current_image }}"
      when: scheduler_current_image | length > 0
      no_log: true

    - name: Restore the previous scheduler image
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - ford-scraper-scheduler
          - -f
          - "{{ remote_root }}/mcp/scheduler-compose.yml"
          - up
          - -d
          - --wait
          - scheduler
      when: scheduler_current_image | length > 0
      changed_when: true
      no_log: true

    - name: Leave scheduler stopped when no prior version was running
      ansible.builtin.command:
        cmd: docker rm --force ford-scraping-scheduler
      when: scheduler_current_image | length == 0
      changed_when: true
      failed_when: false

    - name: Restore prior scheduler state when present
      ansible.builtin.copy:
        dest: "{{ remote_root }}/mcp/scheduler-release.json"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
        content: "{{ scheduler_state_raw.content | b64decode }}"
      when: scheduler_state_file.stat.exists

    - name: Remove incomplete scheduler state on first deployment
      ansible.builtin.file:
        path: "{{ remote_root }}/mcp/scheduler-release.json"
        state: absent
      when: not scheduler_state_file.stat.exists

    - name: Report failed scheduler candidate after restoring prior service
      ansible.builtin.fail:
        msg: "Scheduler candidate failed its health check; the prior scheduler was restored."
