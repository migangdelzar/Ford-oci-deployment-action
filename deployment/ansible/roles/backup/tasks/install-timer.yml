---
- name: Install monthly backup timer
  ansible.builtin.template:
    src: ford-backup.timer.j2
    dest: /etc/systemd/system/ford-backup.timer
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd after updating the backup timer
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and restart the monthly backup timer
  ansible.builtin.systemd:
    name: ford-backup.timer
    enabled: true
    state: restarted
