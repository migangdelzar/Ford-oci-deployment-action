---
- name: Require an application image
  ansible.builtin.assert:
    that: [app_image is defined, app_image | length > 0]
    fail_msg: "Pass app_image from the deployment task."

- name: Configure observability credentials and runtime files
  ansible.builtin.import_tasks: configure-observability.yml

- name: Detect the Docker data directory
  ansible.builtin.command:
    cmd: "docker info --format '{% raw %}{{.DockerRootDir}}{% endraw %}'"
  register: docker_root_dir
  changed_when: false

- name: Set the Docker container log directory
  ansible.builtin.set_fact:
    docker_container_logs_path: "{{ docker_root_dir.stdout | trim }}/containers"

- name: Authenticate to GHCR
  ansible.builtin.command:
    cmd: docker login ghcr.io --username "{{ ghcr_username }}" --password-stdin
    stdin: "{{ lookup('ansible.builtin.env', 'GHCR_TOKEN') }}"
  no_log: true
  changed_when: false
  when: lookup('ansible.builtin.env', 'GHCR_TOKEN') | default('', true) | length > 0 and app_image is match('^ghcr[.]io/')

- name: Pull application image from registry
  ansible.builtin.command:
    cmd: docker pull "{{ app_image }}"
  register: image_pull
  changed_when: true
  when: app_image is match('^ghcr[.]io/') and not (app_image_preloaded | default(false) | bool)

- name: Copy application image archive for local fallback
  ansible.builtin.copy:
    src: "{{ app_image_archive }}"
    dest: "{{ remote_root }}/app/app-image.tar"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when: app_image is not match('^ghcr[.]io/') and not (app_image_preloaded | default(false) | bool)

- name: Load local application image archive
  ansible.builtin.command:
    cmd: docker load --input "{{ remote_root }}/app/app-image.tar"
  register: image_load
  changed_when: true
  when: app_image is not match('^ghcr[.]io/') and not (app_image_preloaded | default(false) | bool)

- name: Remove transferred image archive
  ansible.builtin.file:
    path: "{{ remote_root }}/app/app-image.tar"
    state: absent
  when: app_image is not match('^ghcr[.]io/') and not (app_image_preloaded | default(false) | bool)

- name: Render application Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ remote_root }}/app/compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"

- name: Start application
  ansible.builtin.command:
    cmd: docker compose --env-file "{{ remote_root }}/app/.env" -f "{{ remote_root }}/app/compose.yml" up -d
  register: app_compose
  changed_when: "'Started' in app_compose.stdout or 'Created' in app_compose.stdout or 'Recreated' in app_compose.stdout"

- name: Wait for application health
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/actuator/health
    status_code: 200
    timeout: 10
  register: app_health
  retries: 30
  delay: 5
  until: app_health.status == 200
