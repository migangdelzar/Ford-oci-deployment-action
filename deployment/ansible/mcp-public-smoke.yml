---
- name: Verify the public Ford MCP endpoint
  hosts: all
  gather_facts: false
  tasks:
    - name: Validate the public smoke-check inputs
      ansible.builtin.assert:
        that:
          - mcp_public_smoke_url == 'https://ford-mcp.emme.business/mcp'
          - mcp_public_smoke_access_client_id is match('^[A-Za-z0-9._-]+$')
          - mcp_public_smoke_access_client_secret_secret_ocid is match('^ocid1[.]vaultsecret[.][A-Za-z0-9.]+$')
          - mcp_public_smoke_token_secret_ocid is match('^ocid1[.]vaultsecret[.][A-Za-z0-9.]+$')
        fail_msg: "Public MCP smoke-check configuration is incomplete."

    - name: Read public MCP authentication secrets from OCI Vault
      ansible.builtin.command:
        argv:
          - /usr/local/bin/oci
          - secrets
          - secret-bundle
          - get
          - --auth
          - instance_principal
          - --secret-id
          - "{{ item }}"
          - --query
          - 'data."secret-bundle-content".content'
          - --raw-output
      loop:
        - "{{ mcp_public_smoke_token_secret_ocid }}"
        - "{{ mcp_public_smoke_access_client_secret_secret_ocid }}"
      register: mcp_public_smoke_secret_bundles
      changed_when: false
      no_log: true

    - name: Decode public MCP authentication secrets
      ansible.builtin.set_fact:
        mcp_public_smoke_bearer_token: "{{ mcp_public_smoke_secret_bundles.results[0].stdout | trim | b64decode }}"
        mcp_public_smoke_access_client_secret: "{{ mcp_public_smoke_secret_bundles.results[1].stdout | trim | b64decode }}"
      no_log: true

    - name: Initialize MCP through the public Cloudflare route
      ansible.builtin.uri:
        url: "{{ mcp_public_smoke_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ mcp_public_smoke_bearer_token }}"
          CF-Access-Client-Id: "{{ mcp_public_smoke_access_client_id }}"
          CF-Access-Client-Secret: "{{ mcp_public_smoke_access_client_secret }}"
          Host: ford-mcp.emme.business
          Accept: application/json, text/event-stream
        body_format: json
        body:
          jsonrpc: "2.0"
          id: 1
          method: initialize
          params:
            protocolVersion: "2025-03-26"
            capabilities: {}
            clientInfo:
              name: deployment-public-smoke
              version: "1"
        status_code: 200
        return_content: true
        timeout: 20
      register: mcp_public_initialize
      no_log: true

    - name: Verify public MCP tools/list
      ansible.builtin.uri:
        url: "{{ mcp_public_smoke_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ mcp_public_smoke_bearer_token }}"
          CF-Access-Client-Id: "{{ mcp_public_smoke_access_client_id }}"
          CF-Access-Client-Secret: "{{ mcp_public_smoke_access_client_secret }}"
          Host: ford-mcp.emme.business
          Accept: application/json, text/event-stream
        body_format: json
        body:
          jsonrpc: "2.0"
          id: 2
          method: tools/list
          params: {}
        status_code: 200
        return_content: true
        timeout: 20
      register: mcp_public_tools
      no_log: true
      failed_when: >-
        mcp_public_tools.status != 200 or
        'search_vehicles' not in mcp_public_tools.content or
        'get_vehicle' not in mcp_public_tools.content or
        'compare_trims' not in mcp_public_tools.content or
        'search_offers' not in mcp_public_tools.content

    - name: Verify semantic vehicle search through the public MCP route
      ansible.builtin.uri:
        url: "{{ mcp_public_smoke_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ mcp_public_smoke_bearer_token }}"
          CF-Access-Client-Id: "{{ mcp_public_smoke_access_client_id }}"
          CF-Access-Client-Secret: "{{ mcp_public_smoke_access_client_secret }}"
          Host: ford-mcp.emme.business
          Accept: application/json, text/event-stream
        body_format: json
        body:
          jsonrpc: "2.0"
          id: 3
          method: tools/call
          params:
            name: search_vehicles
            arguments:
              query: "SUV familiar cómoda para viajes con buen espacio"
              filters: {}
              limit: 3
        status_code: 200
        return_content: true
        timeout: 60
      register: mcp_public_search
      no_log: true
      failed_when: >-
        mcp_public_search.status != 200 or
        (mcp_public_search.content | regex_search('"isError"\\s*:\\s*true')) is not none or
        (mcp_public_search.content | regex_search('"modelPageUrl"\\s*:\\s*"https://www\\.forduruapan\\.mx/[^\"]+"')) is none
