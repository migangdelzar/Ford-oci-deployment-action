---
- name: Deploy Ford catalog MCP with a local blue-green proxy
  hosts: data
  become: true
  tasks:
    - name: Configure MCP runtime secrets from OCI Vault
      ansible.builtin.import_role:
        name: mcp
        tasks_from: configure-runtime.yml
    - name: Run Ford MCP blue-green deployment tasks
      ansible.builtin.import_role:
        name: mcp
        tasks_from: blue-green.yml
  post_tasks:
    - name: Fetch redacted MCP release metadata for the deployment summary
      ansible.builtin.fetch:
        src: "{{ remote_root }}/mcp/active-release.json"
        dest: "{{ release_summary_path }}"
        flat: true
      when: release_summary_path is defined
